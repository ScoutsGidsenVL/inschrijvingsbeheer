[project]
name = "inschrijvingsbeheer"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "Django>=5.2.17,<6",
  # enkel geladen als DEBUG aan staat (settings.py, urls.py)
  "django-debug-toolbar>=6.3.0,<7",
  "gunicorn>=26,<27",
  "mozilla-django-oidc>=5.0.2,<6",
  # backend "mssql" voor de Integreat-databank
  "mssql-django>=1.8.0,<2",
  "procrastinate[django]>=3.9.0,<4",
  # PostgreSQL-driver voor de backend config.postgresql13_eol
  "psycopg[binary]>=3.3.5,<4",
  # crypto: jwt.PyJWK met RSA-sleutels in config/oidc.py
  "PyJWT[crypto]>=2.15.0,<3",
  "pypdf>=6.21.4,<7",
  "python-dotenv>=1.2.2,<2",
  "reportlab>=5.0.1,<6",
  "requests>=2.34.2,<3",
  "urllib3>=2.8.0,<3",
  "zeep>=4.3.3,<5",
]

[dependency-groups]
# tools voor ontwikkeling en CI; Ansible installeert met --no-dev
dev = [
  "ruff>=0.6.9,<0.7",
]

[tool.uv]
# applicatie, geen pakket: uv bouwt of installeert het project zelf niet
package = false

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [
  "migrations",
  "!migrations/0001_initial.py",
]

[tool.ruff.lint]
select = ["E", "F", "I"]  # errors, fouten, import-sortering

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]